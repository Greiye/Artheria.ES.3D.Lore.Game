# Smoke test on every pull request (and on main): build, then two quick browser suites in headless Chromium
# (software rendering). The full e2e set is long and timing-sensitive; run it locally with `npm run test:e2e`.
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Pinned: ubuntu-latest is moving to Ubuntu 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      # Same runner as the nightly set, so the suites get the CI stretch (test/slow.mjs) and one retry.
      - run: node scripts/e2e-run.mjs --only boot,town,menus,multiplayer
        env:
          E2E_SLOW: '2.5'
          E2E_RETRY: '1'
